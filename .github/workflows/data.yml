name: 更新交通數據

# 唔用任何外部 action（actions/checkout 等）：repo 嘅 Actions 權限設定可能唔准用，
# 會令 workflow 啟動前就失敗（startup_failure）。runner 本身有 git 同 Python 3。
on:
  schedule:
    - cron: '17 20 * * *'   # 每日香港時間 04:17（UTC 20:17）
  push:
    branches: [main]
    paths:   # 改咗 pipeline 或者呢個 workflow 就即刻用新程式生成數據
      - 'pipeline/**'
      - '.github/workflows/data.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '強制發佈（路線數量大跌都照發佈，例如真係有大量路線取消；結構錯誤照樣唔發佈）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: 取得程式碼
        run: |
          git clone -q --depth 1 --branch "${{ github.ref_name }}" "$REPO_URL" .
          python3 --version
      - name: 下載原始數據
        run: python3 pipeline/fetch.py
      - name: 生成數據
        run: python3 pipeline/build.py
      - name: 檢查數據（同上一版比較，大跌就唔發佈，網站繼續用舊數據）
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          mkdir -p /tmp/prev
          if git fetch -q --depth 1 origin data; then
            git show FETCH_HEAD:stats.json > /tmp/prev/stats.json 2>/dev/null || rm -f /tmp/prev/stats.json
            git show FETCH_HEAD:index.json > /tmp/prev/index.json 2>/dev/null || rm -f /tmp/prev/index.json
          fi
          python3 pipeline/check.py --prev /tmp/prev $FORCE
      - name: 發佈到 data 分支
        # 用獨立分支，唔會令 main 嘅 git 歷史越嚟越大。
        # 網頁版設定 DATA_BASE_URL=https://raw.githubusercontent.com/<owner>/<repo>/data
        run: |
          cd pipeline/out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "數據更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "$REPO_URL" data
