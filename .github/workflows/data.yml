name: 更新交通數據

on:
  schedule:
    - cron: '17 20 * * *'   # 每日香港時間 04:17（UTC 20:17）
  workflow_dispatch:
    inputs:
      force:
        description: '強制發佈（路線數量大跌都照發佈，例如真係有大量路線取消；結構錯誤照樣唔發佈）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: 下載原始數據
        run: python3 pipeline/fetch.py
      - name: 生成數據
        run: python3 pipeline/build.py
      - name: 檢查數據（同上一版比較，大跌就唔發佈，網站繼續用舊數據）
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          mkdir -p /tmp/prev
          if git fetch -q --depth 1 origin data; then
            git show origin/data:stats.json > /tmp/prev/stats.json 2>/dev/null || rm -f /tmp/prev/stats.json
            git show origin/data:index.json > /tmp/prev/index.json 2>/dev/null || rm -f /tmp/prev/index.json
          fi
          python3 pipeline/check.py --prev /tmp/prev $FORCE
      - name: 發佈到 data 分支
        # 用獨立分支，唔會令 main 嘅 git 歷史越嚟越大。
        # 網頁版設定 DATA_BASE_URL=https://raw.githubusercontent.com/<owner>/<repo>/data
        run: |
          cd pipeline/out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "數據更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
