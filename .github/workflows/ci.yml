name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 用 Node 內置嘅 corepack 安裝 package.json 指定嘅 pnpm 版本，唔使第三方 action
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hknt/core test
      - run: pnpm -r typecheck
