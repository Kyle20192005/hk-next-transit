name: CI

# 唔用任何外部 action（理由見 data.yml）。runner 本身有 git 同 Node。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取得程式碼
        run: git clone -q --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" . && git fetch -q --depth 1 origin "${{ github.sha }}" && git checkout -q "${{ github.sha }}"
      # 用 Node 內置嘅 corepack 安裝 package.json 指定嘅 pnpm 版本
      - run: node --version && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hknt/core test
      - run: pnpm -r typecheck
